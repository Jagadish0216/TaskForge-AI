# Server configuration
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# Database Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/taskforge_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SpringDoc OpenAPI Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.taskforge=DEBUG

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:mock-key}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.models=${GEMINI_MODELS:gemini-3.8-flash,gemini-3.7-flash,gemini-3.5-flash-lite}
gemini.retry.maxAttempts=3
gemini.retry.initialDelay=1000
gemini.connect.timeout=15000
gemini.read.timeout=60000

# Security & JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:86400000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Google OAuth Configuration
google.client-id=${GOOGLE_CLIENT_ID:mock-google-client-id.apps.googleusercontent.com}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Demo Data Seeding Configuration (default: false)
app.seed-demo-data=${APP_SEED_DEMO_DATA:false}
